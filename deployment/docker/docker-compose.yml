# Production compose file: exactly two services, backend and frontend.
# Every native service (PostgreSQL, VictoriaMetrics, vmagent, vmauth,
# MediaMTX, Caddy) runs outside Docker via systemd — this file never defines
# them and never assumes they're reachable at "localhost" from inside a
# container. Configuration comes entirely from .env (see .env.example);
# nothing here should need editing to point at a different host's services.

services:
  backend:
    image: ${BACKEND_IMAGE:-samslab-backend}:${APP_VERSION:-latest}
    container_name: samslab-backend
    restart: unless-stopped
    env_file:
      - .env
    # Bound to localhost only — the native Caddy instance reverse-proxies
    # from here; the container is never directly internet-facing.
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    networks:
      - samslab_internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPU_LIMIT:-1.0}"
          memory: ${BACKEND_MEMORY_LIMIT:-512M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE:-samslab-frontend}:${APP_VERSION:-latest}
    container_name: samslab-frontend
    restart: unless-stopped
    env_file:
      - .env
    # Same reasoning as backend: localhost-only, fronted by native Caddy.
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8080}:80"
    networks:
      - samslab_internal
    read_only: true
    # nginx-unprivileged runs as uid/gid 101 ("nginx") — a plain root-owned
    # tmpfs mount isn't writable by it, so these need explicit ownership.
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=1770
      - /var/run:uid=101,gid=101,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only nginx-unprivileged's one real need: bind to port 80 while still
    # running as a non-root user. Nothing else is granted back.
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-0.5}"
          memory: ${FRONTEND_MEMORY_LIMIT:-128M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  # Not `internal: true` — backend must still reach native PostgreSQL/
  # VictoriaMetrics/MediaMTX, which live outside Docker on the host/LAN.
  samslab_internal:
    driver: bridge
