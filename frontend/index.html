<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      viewport-fit=cover lets the app draw edge-to-edge on notched/Dynamic
      Island devices, in exchange for owning safe-area insets ourselves via
      env(safe-area-inset-*) — see index.css's .safe-area-* utilities and
      AppShell/TopBar/Sidebar, which apply them. maximum-scale/user-scalable
      are deliberately left at their defaults: pinch-zoom must keep working
      everywhere (Safari also ignores maximum-scale=1 on <input> focus
      unless the meta itself blocks zoom, so this app never fights it).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1f26" />
    <!-- iOS "Add to Home Screen" affordances — no service worker/offline support (not implemented), just organizing for it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sam's Lab" />
    <title>Sam's Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
