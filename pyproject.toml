[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sams-lab-server"
version = "0.1.0"
description = "Cloud-server foundation for Sam's Lab."
requires-python = ">=3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<24",
  "dependency-injector>=4.42,<5",
  "fastapi>=0.115,<0.128",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "websockets>=13,<17",
]

[tool.setuptools]
packages = ["server", "shared"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "shared"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["server/app", "server/tests", "shared", "tests", "examples", "scripts"]
mypy_path = ["server", "."]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["dependency_injector.*", "structlog.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["server/tests", "tests"]
pythonpath = ["server", "."]
addopts = ["-ra"]
asyncio_mode = "auto"
markers = [
  "load: heavier multi-agent/multi-command load tests (run explicitly with `-m load`)",
]

[tool.coverage.run]
concurrency = ["thread"]
