[alembic]
script_location = alembic
prepend_sys_path = server
sqlalchemy.url = postgresql+psycopg://placeholder:placeholder@localhost/samslab

# Standard Alembic logging template — env.py's fileConfig() call requires
# these sections to exist at all, even though structlog handles the
# application's own logging elsewhere; without them, every `alembic`
# invocation fails before it ever reaches a migration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
