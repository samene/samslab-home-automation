# Serves the built Vite SPA: gzip, cache headers for hashed static assets,
# and a catch-all fallback to index.html for client-side (React Router) routes.
# Runs under nginx-unprivileged (non-root); binding port 80 despite that
# requires the container to be granted CAP_NET_BIND_SERVICE (see
# docker-compose.yml) — every path nginx itself needs to write to is already
# redirected under /tmp by that image, so nothing else here needs root.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed build assets (Vite's assets/*-<hash>.js|css) are safe to cache
        # for a long time; index.html itself must always be revalidated so a
        # new deployment is picked up on the next load.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri /index.html;
        }
    }
}
